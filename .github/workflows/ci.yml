name: MedSecure CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run automated security tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t medsecure-monitor:ci .

      - name: Test container execution
        run: |
          docker run --rm medsecure-monitor:ci