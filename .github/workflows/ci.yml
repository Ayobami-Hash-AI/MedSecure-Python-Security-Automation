name: MedSecure CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Run automated security tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build --pull -t medsecure-monitor:ci .

      - name: Test container execution
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges medsecure-monitor:ci