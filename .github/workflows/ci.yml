name: MedSecure CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Run automated security tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build --pull -t medsecure-monitor:ci .

      - name: Test container execution
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges medsecure-monitor:ci